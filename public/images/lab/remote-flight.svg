<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-label="Remote Flight — smartwatch HUD">
  <!-- Ambient background -->
  <defs>
    <radialGradient id="stage" cx="50%" cy="20%" r="80%">
      <stop offset="0" stop-color="#1a1a1e"/>
      <stop offset="0.55" stop-color="#0a0a0c"/>
      <stop offset="1" stop-color="#050506"/>
    </radialGradient>
    <linearGradient id="chassis" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b2b2e"/>
      <stop offset="0.4" stop-color="#1a1a1c"/>
      <stop offset="1" stop-color="#0f0f11"/>
    </linearGradient>
    <linearGradient id="crown" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#3a3a3e"/>
      <stop offset="0.5" stop-color="#2a2a2e"/>
      <stop offset="1" stop-color="#1a1a1c"/>
    </linearGradient>
  </defs>
  <rect width="480" height="360" fill="url(#stage)"/>

  <!-- Watch chassis — vertical aluminum body, centered -->
  <g transform="translate(180, 30)">
    <!-- Outer body -->
    <rect x="0" y="0" width="120" height="300" rx="32" fill="url(#chassis)"/>

    <!-- Digital Crown -->
    <rect x="118" y="96" width="7" height="28" rx="2.5" fill="url(#crown)"/>
    <g stroke="rgba(255,255,255,0.12)" stroke-width="0.5">
      <line x1="119" y1="100" x2="124" y2="100"/>
      <line x1="119" y1="104" x2="124" y2="104"/>
      <line x1="119" y1="108" x2="124" y2="108"/>
      <line x1="119" y1="112" x2="124" y2="112"/>
      <line x1="119" y1="116" x2="124" y2="116"/>
      <line x1="119" y1="120" x2="124" y2="120"/>
    </g>
    <!-- Side button -->
    <rect x="118" y="160" width="7" height="20" rx="2" fill="#2a2a2e"/>

    <!-- Display inset -->
    <rect x="10" y="22" width="100" height="256" rx="20" fill="#000000"/>

    <!-- Top row: battery + signal bars -->
    <g font-family="system-ui, -apple-system, sans-serif" font-size="7.5" font-weight="600" fill="#EBEBF5">
      <text x="20" y="42">BAT  92%</text>
    </g>
    <g fill="#EBEBF5" transform="translate(86, 34)">
      <rect x="0"  y="6" width="2" height="2" rx="0.5"/>
      <rect x="3"  y="4" width="2" height="4" rx="0.5"/>
      <rect x="6"  y="2" width="2" height="6" rx="0.5"/>
      <rect x="9"  y="0" width="2" height="8" rx="0.5" opacity="0.35"/>
    </g>

    <!-- Big altitude number -->
    <text x="60" y="110" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="700" fill="#FFFFFF" letter-spacing="-1.2">324</text>
    <text x="90" y="110" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#8E8E93">ft</text>

    <!-- Speed + heading -->
    <text x="60" y="130" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="#8E8E93">22 mph · HDG 087°</text>

    <!-- ORBIT pill -->
    <g transform="translate(36, 144)">
      <rect width="48" height="16" rx="8" fill="#0A3E8A"/>
      <text x="24" y="11" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="600" fill="#9EC4FF" letter-spacing="0.5">ORBIT</text>
    </g>

    <!-- Mini map strip at the bottom of the display -->
    <g transform="translate(20, 180)">
      <rect width="80" height="48" rx="4" fill="#0c1018"/>
      <!-- Grid -->
      <g stroke="#243040" stroke-width="0.5">
        <line x1="16" y1="0" x2="16" y2="48"/>
        <line x1="32" y1="0" x2="32" y2="48"/>
        <line x1="48" y1="0" x2="48" y2="48"/>
        <line x1="64" y1="0" x2="64" y2="48"/>
        <line x1="0"  y1="12" x2="80" y2="12"/>
        <line x1="0"  y1="24" x2="80" y2="24"/>
        <line x1="0"  y1="36" x2="80" y2="36"/>
      </g>
      <!-- Plane dot + halo -->
      <circle cx="40" cy="22" r="10" fill="none" stroke="#0A84FF" stroke-width="0.5" opacity="0.4"/>
      <circle cx="40" cy="22" r="3.5" fill="#0A84FF"/>
    </g>

    <!-- Home indicator-ish bottom bar -->
    <rect x="50" y="262" width="20" height="3" rx="1.5" fill="#2a2a2e"/>
  </g>

  <!-- Small annotation right of the watch -->
  <g font-family="system-ui, -apple-system, sans-serif" fill="#5b5e66">
    <text x="320" y="170" font-size="10" letter-spacing="0.5">HUD · 324 ft</text>
    <text x="320" y="186" font-size="9" fill="#3f4249">orbit mode</text>
  </g>
</svg>
