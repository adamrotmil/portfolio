<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-label="Remote Flight — smartwatch HUD">
  <defs>
    <radialGradient id="stage" cx="50%" cy="18%" r="85%">
      <stop offset="0" stop-color="#1d1d21"/>
      <stop offset="0.55" stop-color="#0a0a0c"/>
      <stop offset="1" stop-color="#030304"/>
    </radialGradient>
    <linearGradient id="chassis" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#303034"/>
      <stop offset="0.4" stop-color="#1a1a1c"/>
      <stop offset="1" stop-color="#0f0f11"/>
    </linearGradient>
    <linearGradient id="crown" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#3f3f43"/>
      <stop offset="0.5" stop-color="#2d2d31"/>
      <stop offset="1" stop-color="#1a1a1c"/>
    </linearGradient>
  </defs>
  <rect width="480" height="360" fill="url(#stage)"/>

  <!--
    Apple Watch Series 10 45mm: 38mm × 45mm body, aspect ratio ~0.84.
    At 167 × 198 the watch reads proportionally without dominating
    the 480×360 frame.
  -->
  <g transform="translate(157, 58)">
    <rect x="0" y="0" width="167" height="198" rx="38" fill="url(#chassis)"
          stroke="rgba(0,0,0,0.6)" stroke-width="0.5"/>

    <!-- Digital Crown -->
    <rect x="165.5" y="58" width="8" height="22" rx="2.5" fill="url(#crown)"/>
    <g stroke="rgba(255,255,255,0.18)" stroke-width="0.6">
      <line x1="166.5" y1="62" x2="172.5" y2="62"/>
      <line x1="166.5" y1="65" x2="172.5" y2="65"/>
      <line x1="166.5" y1="68" x2="172.5" y2="68"/>
      <line x1="166.5" y1="71" x2="172.5" y2="71"/>
      <line x1="166.5" y1="74" x2="172.5" y2="74"/>
      <line x1="166.5" y1="77" x2="172.5" y2="77"/>
    </g>
    <!-- Side button -->
    <rect x="165.5" y="108" width="7" height="18" rx="2" fill="#2a2a2e"/>

    <!-- Display inset -->
    <rect x="12" y="14" width="143" height="170" rx="26" fill="#000000"/>

    <!-- Status row -->
    <g font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="600" fill="#EBEBF5">
      <text x="24" y="36">BAT  92%</text>
    </g>
    <g fill="#EBEBF5" transform="translate(128, 26)">
      <rect x="0"  y="8"  width="2.5" height="3"  rx="0.7"/>
      <rect x="4"  y="5"  width="2.5" height="6"  rx="0.7"/>
      <rect x="8"  y="2"  width="2.5" height="9"  rx="0.7"/>
      <rect x="12" y="-1" width="2.5" height="12" rx="0.7" opacity="0.35"/>
    </g>

    <!-- Big altitude -->
    <g font-family="system-ui, -apple-system, sans-serif" text-anchor="end">
      <text x="105" y="82" font-size="46" font-weight="700" fill="#FFFFFF" letter-spacing="-1.8">324</text>
      <text x="133" y="82" font-size="13" font-weight="500" fill="#8E8E93">ft</text>
    </g>

    <!-- Speed + heading -->
    <text x="83.5" y="100" text-anchor="middle"
          font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#8E8E93">
      22 mph · HDG 087°
    </text>

    <!-- ORBIT pill -->
    <g transform="translate(55.5, 110)">
      <rect width="56" height="18" rx="9" fill="#0A3E8A"/>
      <text x="28" y="12.5" text-anchor="middle"
            font-family="system-ui, -apple-system, sans-serif"
            font-size="9" font-weight="700" fill="#9EC4FF" letter-spacing="0.8">
        ORBIT
      </text>
    </g>

    <!-- Mini map strip -->
    <g transform="translate(23, 136)">
      <rect width="121" height="36" rx="6" fill="#0c1018"/>
      <g stroke="#243040" stroke-width="0.5">
        <line x1="24" y1="0" x2="24" y2="36"/>
        <line x1="48" y1="0" x2="48" y2="36"/>
        <line x1="72" y1="0" x2="72" y2="36"/>
        <line x1="96" y1="0" x2="96" y2="36"/>
        <line x1="0"  y1="12" x2="121" y2="12"/>
        <line x1="0"  y1="24" x2="121" y2="24"/>
      </g>
      <circle cx="60" cy="18" r="13" fill="none" stroke="#0A84FF" stroke-width="0.6" opacity="0.35"/>
      <circle cx="60" cy="18" r="8"  fill="none" stroke="#0A84FF" stroke-width="0.8" opacity="0.6"/>
      <circle cx="60" cy="18" r="4"  fill="#0A84FF"/>
    </g>
  </g>

  <!-- Quiet caption -->
  <g font-family="system-ui, -apple-system, sans-serif" fill="#5b5e66">
    <text x="340" y="172" font-size="11" letter-spacing="0.4">HUD · 324 ft</text>
    <text x="340" y="190" font-size="10" fill="#3f4249">orbit mode</text>
  </g>
</svg>
