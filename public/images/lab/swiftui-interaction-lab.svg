<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-label="SwiftUI Interaction Lab">
  <defs>
    <!-- iOS Home Screen–style wallpaper: soft gradient from upper-left -->
    <linearGradient id="iosBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"    stop-color="#343a5c"/>
      <stop offset="0.6"  stop-color="#1e2240"/>
      <stop offset="1"    stop-color="#0d1025"/>
    </linearGradient>
    <radialGradient id="iosGlow" cx="25%" cy="15%" r="70%">
      <stop offset="0" stop-color="#5b6ce5" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#5b6ce5" stop-opacity="0"/>
    </radialGradient>
    <!-- Frosted card -->
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="rgba(255,255,255,0.12)"/>
      <stop offset="1"   stop-color="rgba(255,255,255,0.06)"/>
    </linearGradient>
    <!-- Toggle ON — SwiftUI's Color.green -->
    <linearGradient id="toggleOn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#30D158"/>
      <stop offset="1" stop-color="#1ca647"/>
    </linearGradient>
    <!-- Slider track, filled portion -->
    <linearGradient id="sliderFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5E7BFF"/>
      <stop offset="1" stop-color="#2E5BFF"/>
    </linearGradient>
  </defs>

  <rect width="480" height="360" fill="url(#iosBg)"/>
  <rect width="480" height="360" fill="url(#iosGlow)"/>

  <!--
    Glassmorphic settings card — SwiftUI's native "List" row treatment
    with a section header, toggle row, slider, and segmented control.
    Scaled so the card itself reads as the subject.
  -->
  <g transform="translate(100, 60)">
    <!-- Card surface (semi-transparent + hairline border) -->
    <rect width="280" height="240" rx="26" fill="url(#card)"
          stroke="rgba(255,255,255,0.18)" stroke-width="1"/>

    <!-- Section header -->
    <text x="24" y="34" font-family="-apple-system, 'SF Pro Text', system-ui, sans-serif"
          font-size="13" font-weight="700" fill="rgba(255,255,255,0.65)" letter-spacing="0.6">
      INTERACTION
    </text>

    <!-- Row 1 — Toggle, ON -->
    <g transform="translate(24, 56)">
      <text x="0" y="16" font-family="-apple-system, 'SF Pro Text', system-ui, sans-serif"
            font-size="16" font-weight="500" fill="#FFFFFF">Haptic feedback</text>
      <g transform="translate(200, 0)">
        <rect width="52" height="32" rx="16" fill="url(#toggleOn)"/>
        <circle cx="36" cy="16" r="13" fill="#FFFFFF"/>
      </g>
    </g>

    <line x1="24" y1="96" x2="256" y2="96" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

    <!-- Row 2 — Slider -->
    <g transform="translate(24, 112)">
      <text x="0" y="0" font-family="-apple-system, 'SF Pro Text', system-ui, sans-serif"
            font-size="16" font-weight="500" fill="#FFFFFF">Spring stiffness</text>
      <text x="232" y="0" text-anchor="end"
            font-family="ui-monospace, 'SF Mono', Menlo, monospace"
            font-size="13" font-weight="500" fill="rgba(255,255,255,0.62)">
        340
      </text>
      <rect x="0" y="14" width="232" height="4" rx="2" fill="rgba(255,255,255,0.16)"/>
      <rect x="0" y="14" width="158" height="4" rx="2" fill="url(#sliderFill)"/>
      <circle cx="158" cy="16" r="10" fill="#FFFFFF"/>
      <circle cx="158" cy="16" r="10" fill="none" stroke="rgba(0,0,0,0.08)" stroke-width="1"/>
    </g>

    <line x1="24" y1="152" x2="256" y2="152" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

    <!-- Row 3 — Segmented control -->
    <g transform="translate(24, 170)">
      <text x="0" y="16" font-family="-apple-system, 'SF Pro Text', system-ui, sans-serif"
            font-size="16" font-weight="500" fill="#FFFFFF">Curve</text>
      <g transform="translate(104, 0)">
        <rect width="148" height="32" rx="8" fill="rgba(0,0,0,0.28)"/>
        <rect x="51" y="3" width="46" height="26" rx="6"
              fill="rgba(255,255,255,0.18)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
        <g font-family="-apple-system, 'SF Pro Text', system-ui, sans-serif" font-size="13" font-weight="500">
          <text x="25"  y="20" text-anchor="middle" fill="rgba(255,255,255,0.62)">Linear</text>
          <text x="74"  y="20" text-anchor="middle" fill="#FFFFFF">Spring</text>
          <text x="123" y="20" text-anchor="middle" fill="rgba(255,255,255,0.62)">Bounce</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Quiet brand note -->
  <g font-family="-apple-system, 'SF Pro Text', system-ui, sans-serif">
    <text x="32" y="334" font-size="11" font-weight="500" fill="rgba(255,255,255,0.55)" letter-spacing="0.3">SwiftUI</text>
    <text x="72" y="334" font-size="11" fill="rgba(255,255,255,0.3)">· iOS 17</text>
  </g>
</svg>
