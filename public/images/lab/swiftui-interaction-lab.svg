<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-label="SwiftUI Interaction Lab">
  <defs>
    <!--
      Soft iridescent gradient — evokes the "Aurora" Apple uses in Xcode
      hero imagery.  Two stops of saturated hue with a vignetted
      under-layer beneath to keep it from feeling flat.
    -->
    <linearGradient id="iridescent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"    stop-color="#3B5BDB"/>
      <stop offset="0.5"  stop-color="#7B5BE7"/>
      <stop offset="1"    stop-color="#E35F9F"/>
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="25%" r="80%">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
  </defs>

  <!-- Base gradient -->
  <rect width="480" height="360" fill="url(#iridescent)"/>
  <!-- Top-left light leak -->
  <rect width="480" height="360" fill="url(#glow)"/>

  <!--
    Glyph: three concentric chevrons / ripples — a motion/interaction
    metaphor.  Knocked out in white, generous airspace, dead-center.
  -->
  <g transform="translate(240 180)" fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <path d="M -70 22 Q -35 -22 0 22 Q 35 66 70 22" stroke-width="6" opacity="0.35"/>
    <path d="M -54 6  Q -27 -28 0 6  Q 27 40 54 6"  stroke-width="6" opacity="0.6"/>
    <path d="M -38 -8 Q -19 -32 0 -8 Q 19 16 38 -8" stroke-width="6" opacity="1"/>
  </g>

  <!-- Bottom-right small monogram -->
  <text x="444" y="338" text-anchor="end"
        font-family="-apple-system, system-ui, sans-serif"
        font-size="11" font-weight="600" fill="#FFFFFF" fill-opacity="0.65" letter-spacing="0.4">
    SwiftUI
  </text>
</svg>
