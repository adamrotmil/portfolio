<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-label="Client Headlines">
  <defs>
    <!--
      Cream newsprint background — warm off-white with a touch of grain
      feel (via low-opacity noise gradient).  Reads as "editorial"
      without being explicitly a magazine mockup.
    -->
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#F8F2E3"/>
      <stop offset="1"   stop-color="#E8DFCC"/>
    </linearGradient>
    <radialGradient id="paperShade" cx="80%" cy="85%" r="70%">
      <stop offset="0" stop-color="#C8B99B" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#C8B99B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="480" height="360" fill="url(#paper)"/>
  <rect width="480" height="360" fill="url(#paperShade)"/>

  <!-- Thin ruled frame — the "card" gesture -->
  <rect x="28" y="28" width="424" height="304" rx="2"
        fill="none" stroke="rgba(60,40,20,0.14)" stroke-width="1"/>

  <!-- Eyebrow — kicker text, small caps, widely tracked -->
  <text x="48" y="74" font-family="-apple-system, 'SF Pro Text', system-ui, sans-serif"
        font-size="11" font-weight="700" fill="#8E5A25" letter-spacing="2.2">
    HEADLINE · DRAFT
  </text>

  <!--
    The headline proper — set in a generous serif, two lines.  The
    middle word ("whisper") is called out as the AI-generated fill-in
    with a subtle underline + side badge.  This communicates the
    "hybrid AI + template" idea in a single glance.
  -->
  <g font-family="'Canela Text', 'Cormorant Garamond', 'EB Garamond', Georgia, serif"
     fill="#2B1A0E">
    <text x="48" y="140" font-size="42" font-weight="500" letter-spacing="-0.8">
      The clients
    </text>
    <text x="48" y="188" font-size="42" font-weight="500" font-style="italic" letter-spacing="-0.8">
      whisper,
    </text>
    <text x="48" y="236" font-size="42" font-weight="500" letter-spacing="-0.8">
      the brand listens.
    </text>
  </g>

  <!--
    Under the italic word, a subtle dotted underline + a tiny "AI"
    badge — the tell that this word is the generated slot.
  -->
  <g>
    <line x1="48" y1="196" x2="232" y2="196"
          stroke="#8E5A25" stroke-width="1.2" stroke-dasharray="1.5,3" opacity="0.55"/>
    <g transform="translate(240, 168)">
      <rect width="32" height="16" rx="3" fill="#8E5A25"/>
      <text x="16" y="11.5" text-anchor="middle"
            font-family="-apple-system, 'SF Pro Text', system-ui, sans-serif"
            font-size="9" font-weight="700" fill="#F8F2E3" letter-spacing="0.8">
        AI
      </text>
    </g>
  </g>

  <!-- Footer metadata row -->
  <g font-family="-apple-system, 'SF Pro Text', system-ui, sans-serif" fill="rgba(60,40,20,0.55)">
    <text x="48" y="300" font-size="10.5" font-weight="600" letter-spacing="0.4">CLIENT</text>
    <text x="48" y="316" font-size="12" fill="rgba(60,40,20,0.75)">Anthropic · Brand Voice</text>

    <text x="452" y="300" text-anchor="end" font-size="10.5" font-weight="600" letter-spacing="0.4">VARIANT</text>
    <text x="452" y="316" text-anchor="end" font-size="12" fill="rgba(60,40,20,0.75)">03 / 12</text>
  </g>
</svg>
