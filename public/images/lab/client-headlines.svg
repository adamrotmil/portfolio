<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-label="Client Headlines">
  <defs>
    <!--
      Warm editorial gradient — the tile reads as a magazine cover.
      Terracotta / marigold / burgundy, angled from lower-left so the
      glyph sits in a naturally lighter pocket.
    -->
    <linearGradient id="warm" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0"    stop-color="#A8321A"/>
      <stop offset="0.5"  stop-color="#D65A2C"/>
      <stop offset="1"    stop-color="#F2B134"/>
    </linearGradient>
    <radialGradient id="warmGlow" cx="60%" cy="30%" r="70%">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="480" height="360" fill="url(#warm)"/>
  <rect width="480" height="360" fill="url(#warmGlow)"/>

  <!--
    Glyph: a single oversized left-quote mark in white.  Keeps the
    "headline" / "quote" metaphor direct without being literal copy.
  -->
  <g transform="translate(240 196)">
    <text x="0" y="0" text-anchor="middle"
          font-family="'Canela Text', 'Cormorant Garamond', Georgia, serif"
          font-size="260" font-weight="600" fill="#FFFFFF"
          style="font-feature-settings: 'ss01' 1"
          dominant-baseline="central">
      “
    </text>
  </g>

  <!-- Corner label -->
  <text x="444" y="338" text-anchor="end"
        font-family="-apple-system, system-ui, sans-serif"
        font-size="11" font-weight="600" fill="#FFFFFF" fill-opacity="0.7" letter-spacing="0.4">
    Headlines
  </text>
</svg>
