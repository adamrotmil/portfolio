<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-label="Ticker Sandbox — chart + order book">
  <!-- Background matches the modal's bgPrimary -->
  <rect width="480" height="360" fill="#0A0B0D"/>

  <!-- Top strip: segmented control + status pill -->
  <g transform="translate(20, 18)">
    <!-- Segmented pill track -->
    <rect width="144" height="22" rx="11" fill="#1F2023"/>
    <!-- Active segment (BTC in orange) -->
    <rect x="3" y="3" width="34" height="16" rx="8" fill="#F7931A"/>
    <g font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="500">
      <text x="20" y="14" text-anchor="middle" fill="#FFFFFF">BTC</text>
      <text x="50" y="14" text-anchor="middle" fill="#F5F6F7">ETH</text>
      <text x="80" y="14" text-anchor="middle" fill="#F5F6F7">SOL</text>
      <text x="118" y="14" text-anchor="middle" fill="#F5F6F7">Demo</text>
    </g>

    <!-- Live status pill, far right -->
    <g transform="translate(380, 0)">
      <rect width="50" height="22" rx="11" fill="#1F2023"/>
      <circle cx="10" cy="11" r="3" fill="#05B169">
        <!-- Soft glow via stroke ring -->
      </circle>
      <circle cx="10" cy="11" r="3" fill="none" stroke="#05B169" stroke-width="1" opacity="0.35"/>
      <text x="21" y="14" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="500" fill="#05B169">Live</text>
    </g>
  </g>

  <!-- Chart panel (left 2/3) -->
  <g transform="translate(20, 56)">
    <rect width="280" height="280" rx="12" fill="#0A0B0D" stroke="rgba(156,160,168,0.18)" stroke-width="1"/>

    <!-- Big price top-left -->
    <text x="16" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#05B169" letter-spacing="-0.4">$74,978.69</text>

    <!-- Time window chips -->
    <g transform="translate(16, 42)">
      <rect width="20" height="13" rx="6.5" fill="#1F2023"/>
      <text x="10" y="9.5" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="500" fill="#F5F6F7">15s</text>
      <text x="30" y="9.5" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#6A6E76">30s</text>
      <text x="48" y="9.5" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#6A6E76">1m</text>
    </g>

    <!-- Dotted horizontal reference line -->
    <line x1="16" y1="160" x2="264" y2="160" stroke="#2a2d33" stroke-width="0.6" stroke-dasharray="2,3"/>

    <!-- Smooth price curve (wild but controlled) — Bitcoin orange -->
    <g transform="translate(16, 100)" fill="none">
      <!-- Area fill under line -->
      <path d="M 0 130 L 0 95 Q 15 80 30 90 Q 50 110 70 75 Q 90 50 110 70 Q 130 90 150 55 Q 175 30 195 45 Q 215 60 235 48 Q 248 42 248 42 L 248 130 Z"
            fill="url(#areaGrad)" opacity="0.55"/>
      <!-- Line -->
      <path d="M 0 95 Q 15 80 30 90 Q 50 110 70 75 Q 90 50 110 70 Q 130 90 150 55 Q 175 30 195 45 Q 215 60 235 48 Q 245 42 248 42"
            stroke="#F7931A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- End-of-line badge with tail -->
      <circle cx="248" cy="42" r="3" fill="#F7931A"/>
    </g>

    <!-- Current price badge at the line's end -->
    <g transform="translate(206, 138)">
      <rect width="58" height="16" rx="4" fill="#F7931A"/>
      <text x="29" y="11" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="9" font-weight="600" fill="#000000">$74,978</text>
    </g>

    <!-- Right-side y-axis labels -->
    <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="8" fill="#5B616E" text-anchor="end">
      <text x="264" y="100">$74,982</text>
      <text x="264" y="132">$74,978</text>
      <text x="264" y="164">$74,975</text>
      <text x="264" y="196">$74,971</text>
      <text x="264" y="228">$74,967</text>
    </g>

    <!-- Symbol caption bottom-left -->
    <text x="16" y="268" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="8" font-weight="600" fill="#6A6E76" letter-spacing="0.7">$BTC</text>
    <text x="50" y="268" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="8" fill="#3f4249">· Coinbase</text>
  </g>

  <!-- Order book panel (right 1/3) -->
  <g transform="translate(312, 56)">
    <rect width="148" height="280" rx="12" fill="#0A0B0D" stroke="rgba(156,160,168,0.18)" stroke-width="1"/>

    <!-- Header row: Order book + CVD badge -->
    <text x="12" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#F5F6F7" letter-spacing="0.7">ORDER BOOK</text>
    <g transform="translate(92, 9)">
      <rect width="46" height="14" rx="4" fill="rgba(5,177,105,0.12)"/>
      <text x="8"  y="10" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#05B169" opacity="0.7" font-weight="500">CVD</text>
      <text x="24" y="10" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#05B169" font-weight="500">▲</text>
      <text x="38" y="10" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="8" fill="#05B169" font-weight="500" text-anchor="end">+0.11</text>
    </g>

    <!-- Column headers -->
    <line x1="0" y1="28" x2="148" y2="28" stroke="rgba(156,160,168,0.18)" stroke-width="1"/>
    <g font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#6A6E76" letter-spacing="0.7">
      <text x="12" y="40">PRICE</text>
      <text x="80" y="40" text-anchor="end">SIZE</text>
      <text x="136" y="40" text-anchor="end">TOTAL</text>
    </g>
    <line x1="0" y1="48" x2="148" y2="48" stroke="rgba(156,160,168,0.18)" stroke-width="1"/>

    <!-- Asks (red, top). Depth bar fills from right -->
    <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="8.5">
      <!-- 4 ask rows, increasing size toward the spread -->
      <g transform="translate(0, 58)">
        <rect x="30" y="0" width="118" height="11" fill="rgba(207,32,47,0.14)"/>
        <text x="12" y="8" fill="#CF202F" font-weight="600">74,982.61</text>
        <text x="80" y="8" text-anchor="end" fill="#F5F6F7">0.0067</text>
        <text x="136" y="8" text-anchor="end" fill="#F5F6F7" opacity="0.55">0.694</text>
      </g>
      <g transform="translate(0, 70)">
        <rect x="50" y="0" width="98" height="11" fill="rgba(207,32,47,0.14)"/>
        <text x="12" y="8" fill="#CF202F" font-weight="600">74,981.00</text>
        <text x="80" y="8" text-anchor="end" fill="#F5F6F7">0.0400</text>
        <text x="136" y="8" text-anchor="end" fill="#F5F6F7" opacity="0.55">0.687</text>
      </g>
      <g transform="translate(0, 82)">
        <rect x="70" y="0" width="78" height="11" fill="rgba(207,32,47,0.14)"/>
        <text x="12" y="8" fill="#CF202F" font-weight="600">74,980.00</text>
        <text x="80" y="8" text-anchor="end" fill="#F5F6F7">0.0431</text>
        <text x="136" y="8" text-anchor="end" fill="#F5F6F7" opacity="0.55">0.485</text>
      </g>
      <g transform="translate(0, 94)">
        <rect x="92" y="0" width="56" height="11" fill="rgba(207,32,47,0.14)"/>
        <text x="12" y="8" fill="#CF202F" font-weight="600">74,979.15</text>
        <text x="80" y="8" text-anchor="end" fill="#F5F6F7">0.0295</text>
        <text x="136" y="8" text-anchor="end" fill="#F5F6F7" opacity="0.55">0.227</text>
      </g>
    </g>

    <!-- Spread strip -->
    <g transform="translate(0, 112)">
      <rect width="148" height="22" fill="#1F2023"/>
      <text x="12" y="14" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="600" fill="#6A6E76" letter-spacing="0.7">SPREAD</text>
      <text x="90" y="14" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="9" font-weight="500" fill="#F5F6F7">$0.01</text>
      <text x="138" y="14" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#6A6E76">mid 74,978</text>
    </g>

    <!-- Bids (green, below spread) -->
    <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="8.5">
      <g transform="translate(0, 140)">
        <rect x="90" y="0" width="58" height="11" fill="rgba(5,177,105,0.14)"/>
        <text x="12" y="8" fill="#05B169" font-weight="600">74,978.00</text>
        <text x="80" y="8" text-anchor="end" fill="#F5F6F7">0.0333</text>
        <text x="136" y="8" text-anchor="end" fill="#F5F6F7" opacity="0.55">0.033</text>
      </g>
      <g transform="translate(0, 152)">
        <rect x="76" y="0" width="72" height="11" fill="rgba(5,177,105,0.14)"/>
        <text x="12" y="8" fill="#05B169" font-weight="600">74,976.82</text>
        <text x="80" y="8" text-anchor="end" fill="#F5F6F7">0.0213</text>
        <text x="136" y="8" text-anchor="end" fill="#F5F6F7" opacity="0.55">0.108</text>
      </g>
      <g transform="translate(0, 164)">
        <rect x="56" y="0" width="92" height="11" fill="rgba(5,177,105,0.14)"/>
        <text x="12" y="8" fill="#05B169" font-weight="600">74,975.00</text>
        <text x="80" y="8" text-anchor="end" fill="#F5F6F7">0.0357</text>
        <text x="136" y="8" text-anchor="end" fill="#F5F6F7" opacity="0.55">0.196</text>
      </g>
      <g transform="translate(0, 176)">
        <rect x="38" y="0" width="110" height="11" fill="rgba(5,177,105,0.14)"/>
        <text x="12" y="8" fill="#05B169" font-weight="600">74,973.42</text>
        <text x="80" y="8" text-anchor="end" fill="#F5F6F7">0.0687</text>
        <text x="136" y="8" text-anchor="end" fill="#F5F6F7" opacity="0.55">0.359</text>
      </g>
      <g transform="translate(0, 188)">
        <rect x="24" y="0" width="124" height="11" fill="rgba(5,177,105,0.14)"/>
        <text x="12" y="8" fill="#05B169" font-weight="600">74,971.00</text>
        <text x="80" y="8" text-anchor="end" fill="#F5F6F7">0.1537</text>
        <text x="136" y="8" text-anchor="end" fill="#F5F6F7" opacity="0.55">0.485</text>
      </g>
    </g>
  </g>

  <!-- Area gradient definition -->
  <defs>
    <linearGradient id="areaGrad" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#F7931A" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#F7931A" stop-opacity="0"/>
    </linearGradient>
  </defs>
</svg>
