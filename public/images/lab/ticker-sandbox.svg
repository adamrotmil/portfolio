<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-label="Ticker Sandbox — chart + order book">
  <defs>
    <linearGradient id="areaGrad" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#05B169" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#05B169" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="480" height="360" fill="#0A0B0D"/>

  <!-- Top strip: segmented control + status pill -->
  <g transform="translate(20, 18)">
    <rect width="148" height="24" rx="12" fill="#1F2023"/>
    <rect x="3" y="3" width="38" height="18" rx="9" fill="#05B169"/>
    <g font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500">
      <text x="22" y="15.5" text-anchor="middle" fill="#FFFFFF">ETH</text>
      <text x="52" y="15.5" text-anchor="middle" fill="#F5F6F7">SOL</text>
      <text x="82" y="15.5" text-anchor="middle" fill="#F5F6F7">BTC</text>
      <text x="122" y="15.5" text-anchor="middle" fill="#F5F6F7">Demo</text>
    </g>

    <g transform="translate(388, 1)">
      <rect width="52" height="22" rx="11" fill="#1F2023"/>
      <circle cx="11" cy="11" r="3" fill="#05B169"/>
      <circle cx="11" cy="11" r="3" fill="none" stroke="#05B169" stroke-width="1" opacity="0.35"/>
      <text x="22" y="14.5" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="500" fill="#05B169">Live</text>
    </g>
  </g>

  <!-- Chart panel -->
  <g transform="translate(20, 58)">
    <rect width="272" height="278" rx="12" fill="#0A0B0D" stroke="rgba(156,160,168,0.18)" stroke-width="1"/>

    <!-- Big price — ETH-range 4-digit number reads cleaner than BTC 5-digit -->
    <text x="18" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#05B169" letter-spacing="-0.5">$3,842.17</text>

    <!-- Time window chips — more generous hit area + spacing -->
    <g transform="translate(18, 46)" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="500">
      <rect width="24" height="14" rx="7" fill="#1F2023"/>
      <text x="12" y="10" text-anchor="middle" fill="#F5F6F7">15s</text>
      <text x="36" y="10" fill="#6A6E76">30s</text>
      <text x="60" y="10" fill="#6A6E76">1m</text>
    </g>

    <!-- Scrub reference line -->
    <line x1="18" y1="170" x2="250" y2="170" stroke="#2a2d33" stroke-width="0.6" stroke-dasharray="2,3"/>

    <!--
      Price path — smoother than before, with a clear accumulation →
      breakout → pullback shape.  Area fill underneath in the same
      green as the live accent.
    -->
    <g transform="translate(18, 80)" fill="none">
      <path d="M 0 150 L 0 110 Q 16 100 32 112 Q 50 128 68 100 Q 90 68 112 82 Q 130 94 148 70 Q 170 42 192 58 Q 210 72 228 56 L 232 50 L 232 150 Z"
            fill="url(#areaGrad)"/>
      <path d="M 0 110 Q 16 100 32 112 Q 50 128 68 100 Q 90 68 112 82 Q 130 94 148 70 Q 170 42 192 58 Q 210 72 228 56 L 232 50"
            stroke="#05B169" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="232" cy="50" r="3" fill="#05B169"/>
    </g>

    <!--
      Price badge, positioned to the right of the line-end dot so they
      don't collide.  Uses the real Liveline badgeTail pattern.
    -->
    <g transform="translate(190, 123)">
      <rect width="62" height="18" rx="4" fill="#05B169"/>
      <text x="31" y="12.5" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" font-weight="600" fill="#FFFFFF">$3,842.17</text>
    </g>

    <!-- Y-axis labels — spaced so they never overlap price lines above -->
    <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="9" fill="#5B616E" text-anchor="end">
      <text x="256" y="100">3,848</text>
      <text x="256" y="140">3,842</text>
      <text x="256" y="180">3,836</text>
      <text x="256" y="220">3,830</text>
      <text x="256" y="260">3,824</text>
    </g>

    <!-- Symbol caption -->
    <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="9">
      <text x="18" y="264" font-weight="600" fill="#6A6E76" letter-spacing="0.7">$ETH</text>
      <text x="48" y="264" fill="#3f4249">· Coinbase</text>
    </g>
  </g>

  <!-- Order book panel -->
  <g transform="translate(302, 58)">
    <rect width="158" height="278" rx="12" fill="#0A0B0D" stroke="rgba(156,160,168,0.18)" stroke-width="1"/>

    <!-- Header row -->
    <g transform="translate(0, 0)">
      <text x="12" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#F5F6F7" letter-spacing="0.8">ORDER BOOK</text>
      <g transform="translate(100, 10)">
        <rect width="48" height="15" rx="4" fill="rgba(5,177,105,0.14)"/>
        <g font-family="system-ui, -apple-system, sans-serif" font-size="7.5" fill="#05B169">
          <text x="7"  y="10.5" opacity="0.7" font-weight="500" letter-spacing="0.4">CVD</text>
          <text x="25" y="10.5" font-weight="600">▲</text>
          <text x="43" y="10.5" text-anchor="end" font-weight="600">+0.11</text>
        </g>
      </g>
    </g>
    <line x1="0" y1="32" x2="158" y2="32" stroke="rgba(156,160,168,0.18)" stroke-width="1"/>

    <!-- Column headers — smaller, tighter -->
    <g font-family="system-ui, -apple-system, sans-serif" font-size="7" fill="#6A6E76" letter-spacing="0.7" font-weight="600">
      <text x="12" y="44">PRICE</text>
      <text x="92" y="44" text-anchor="end">SIZE</text>
      <text x="146" y="44" text-anchor="end">TOTAL</text>
    </g>
    <line x1="0" y1="52" x2="158" y2="52" stroke="rgba(156,160,168,0.18)" stroke-width="1"/>

    <!--
      Asks — 4 rows, 4-digit ETH prices at 8px mono.  Each row is 12px
      tall so 4 asks + spread + 4 bids fit comfortably.  Depth bars
      fill from the right.
    -->
    <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="8">
      <g transform="translate(0, 58)">
        <rect x="36"  y="0" width="122" height="12" fill="rgba(207,32,47,0.14)"/>
        <text x="12"  y="9" fill="#CF202F" font-weight="600">3,848.20</text>
        <text x="92"  y="9" text-anchor="end" fill="#F5F6F7">0.87</text>
        <text x="146" y="9" text-anchor="end" fill="#F5F6F7" opacity="0.55">3.42</text>
      </g>
      <g transform="translate(0, 72)">
        <rect x="56"  y="0" width="102" height="12" fill="rgba(207,32,47,0.14)"/>
        <text x="12"  y="9" fill="#CF202F" font-weight="600">3,846.50</text>
        <text x="92"  y="9" text-anchor="end" fill="#F5F6F7">1.24</text>
        <text x="146" y="9" text-anchor="end" fill="#F5F6F7" opacity="0.55">2.55</text>
      </g>
      <g transform="translate(0, 86)">
        <rect x="78"  y="0" width="80" height="12" fill="rgba(207,32,47,0.14)"/>
        <text x="12"  y="9" fill="#CF202F" font-weight="600">3,844.80</text>
        <text x="92"  y="9" text-anchor="end" fill="#F5F6F7">0.63</text>
        <text x="146" y="9" text-anchor="end" fill="#F5F6F7" opacity="0.55">1.31</text>
      </g>
      <g transform="translate(0, 100)">
        <rect x="104" y="0" width="54" height="12" fill="rgba(207,32,47,0.14)"/>
        <text x="12"  y="9" fill="#CF202F" font-weight="600">3,843.10</text>
        <text x="92"  y="9" text-anchor="end" fill="#F5F6F7">0.42</text>
        <text x="146" y="9" text-anchor="end" fill="#F5F6F7" opacity="0.55">0.68</text>
      </g>
    </g>

    <!-- Spread strip -->
    <g transform="translate(0, 118)">
      <rect width="158" height="24" fill="#1F2023"/>
      <text x="12" y="15" font-family="system-ui, -apple-system, sans-serif" font-size="7" font-weight="700" fill="#6A6E76" letter-spacing="0.8">SPREAD</text>
      <text x="80" y="15" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" font-weight="600" fill="#F5F6F7">$0.93</text>
      <text x="146" y="15" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="8" fill="#6A6E76">mid 3,842.64</text>
    </g>

    <!-- Bids -->
    <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="8">
      <g transform="translate(0, 148)">
        <rect x="104" y="0" width="54" height="12" fill="rgba(5,177,105,0.14)"/>
        <text x="12"  y="9" fill="#05B169" font-weight="600">3,842.17</text>
        <text x="92"  y="9" text-anchor="end" fill="#F5F6F7">0.38</text>
        <text x="146" y="9" text-anchor="end" fill="#F5F6F7" opacity="0.55">0.38</text>
      </g>
      <g transform="translate(0, 162)">
        <rect x="80"  y="0" width="78" height="12" fill="rgba(5,177,105,0.14)"/>
        <text x="12"  y="9" fill="#05B169" font-weight="600">3,841.04</text>
        <text x="92"  y="9" text-anchor="end" fill="#F5F6F7">0.55</text>
        <text x="146" y="9" text-anchor="end" fill="#F5F6F7" opacity="0.55">0.93</text>
      </g>
      <g transform="translate(0, 176)">
        <rect x="56"  y="0" width="102" height="12" fill="rgba(5,177,105,0.14)"/>
        <text x="12"  y="9" fill="#05B169" font-weight="600">3,839.60</text>
        <text x="92"  y="9" text-anchor="end" fill="#F5F6F7">0.71</text>
        <text x="146" y="9" text-anchor="end" fill="#F5F6F7" opacity="0.55">1.64</text>
      </g>
      <g transform="translate(0, 190)">
        <rect x="36"  y="0" width="122" height="12" fill="rgba(5,177,105,0.14)"/>
        <text x="12"  y="9" fill="#05B169" font-weight="600">3,837.85</text>
        <text x="92"  y="9" text-anchor="end" fill="#F5F6F7">1.08</text>
        <text x="146" y="9" text-anchor="end" fill="#F5F6F7" opacity="0.55">2.72</text>
      </g>
      <g transform="translate(0, 204)">
        <rect x="14"  y="0" width="144" height="12" fill="rgba(5,177,105,0.14)"/>
        <text x="12"  y="9" fill="#05B169" font-weight="600">3,835.00</text>
        <text x="92"  y="9" text-anchor="end" fill="#F5F6F7">1.65</text>
        <text x="146" y="9" text-anchor="end" fill="#F5F6F7" opacity="0.55">4.37</text>
      </g>
    </g>
  </g>
</svg>
