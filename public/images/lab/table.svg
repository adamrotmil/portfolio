<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-label="Table — satellite map of NYC restaurants">
  <defs>
    <!-- Dark satellite base: suggestion of night Manhattan from above, slight vignetting -->
    <linearGradient id="baseGrad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#182530"/>
      <stop offset="0.5" stop-color="#0f1c26"/>
      <stop offset="1" stop-color="#091421"/>
    </linearGradient>

    <!-- Water tint for rivers -->
    <linearGradient id="waterGrad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0c1c2c"/>
      <stop offset="1" stop-color="#061020"/>
    </linearGradient>

    <!-- Warm city-lights glow -->
    <radialGradient id="cityGlow" cx="0.5" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#f4c88a" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#f4c88a" stop-opacity="0"/>
    </radialGradient>

    <!-- Vignette -->
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0.6" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.5"/>
    </radialGradient>

    <pattern id="buildings" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#1a2b3a"/>
      <rect x="0" y="0" width="1.5" height="1.5" fill="#253847"/>
      <rect x="2" y="2" width="1.2" height="1.2" fill="#2e4253"/>
    </pattern>
  </defs>

  <!-- Base -->
  <rect width="480" height="360" fill="url(#baseGrad)"/>

  <!-- Hudson (left) -->
  <path d="M0 0 L78 0 Q 88 80 72 170 Q 58 270 78 360 L 0 360 Z" fill="url(#waterGrad)"/>
  <!-- East River (right) + bottom curve toward harbor -->
  <path d="M480 0 L418 0 Q 406 70 420 150 Q 430 230 388 300 Q 330 350 280 360 L 480 360 Z" fill="url(#waterGrad)"/>
  <!-- Small inlet / gowanus-ish -->
  <path d="M300 320 Q 312 302 334 306 L 336 360 L 300 360 Z" fill="url(#waterGrad)"/>

  <!-- Island block (Manhattan) -->
  <rect x="78" y="0" width="340" height="360" fill="url(#buildings)" opacity="0.7"/>
  <rect x="78" y="0" width="340" height="360" fill="url(#cityGlow)"/>

  <!-- Manhattan avenues (vertical) - very subtle bright scribes -->
  <g stroke="rgba(255,215,150,0.07)" stroke-width="0.8">
    <line x1="120" y1="0" x2="120" y2="360"/>
    <line x1="150" y1="0" x2="150" y2="360"/>
    <line x1="180" y1="0" x2="180" y2="360"/>
    <line x1="210" y1="0" x2="210" y2="360"/>
    <line x1="240" y1="0" x2="240" y2="360"/>
    <line x1="270" y1="0" x2="270" y2="360"/>
    <line x1="300" y1="0" x2="300" y2="360"/>
    <line x1="330" y1="0" x2="330" y2="360"/>
    <line x1="360" y1="0" x2="360" y2="360"/>
    <line x1="390" y1="0" x2="390" y2="360"/>
  </g>

  <!-- Cross streets (horizontal) -->
  <g stroke="rgba(255,215,150,0.05)" stroke-width="0.6">
    <line x1="80" y1="40"  x2="416" y2="40"/>
    <line x1="80" y1="80"  x2="416" y2="80"/>
    <line x1="80" y1="120" x2="416" y2="120"/>
    <line x1="80" y1="160" x2="416" y2="160"/>
    <line x1="80" y1="200" x2="416" y2="200"/>
    <line x1="80" y1="240" x2="416" y2="240"/>
    <line x1="80" y1="280" x2="416" y2="280"/>
    <line x1="80" y1="320" x2="416" y2="320"/>
  </g>

  <!-- Central Park (rectangle of dark green) -->
  <rect x="198" y="60" width="48" height="106" fill="#14322a" opacity="0.85" rx="1"/>
  <rect x="198" y="60" width="48" height="106" fill="none" stroke="rgba(255,215,150,0.05)" stroke-width="0.5"/>

  <!-- Broadway diagonal - a single bright trace -->
  <path d="M 320 80 Q 260 170 180 280" stroke="rgba(255,215,150,0.18)" stroke-width="1.1" fill="none" opacity="0.55"/>

  <!-- Brooklyn block bottom right -->
  <rect x="280" y="296" width="140" height="64" fill="url(#buildings)" opacity="0.65"/>

  <!-- Scattered warm window lights (bokeh) -->
  <g>
    <circle cx="134" cy="84"  r="0.8" fill="#f9d49a" opacity="0.5"/>
    <circle cx="162" cy="128" r="0.9" fill="#f9d49a" opacity="0.6"/>
    <circle cx="190" cy="48"  r="0.8" fill="#fbd3a0" opacity="0.5"/>
    <circle cx="214" cy="188" r="0.9" fill="#f9d49a" opacity="0.55"/>
    <circle cx="256" cy="96"  r="0.8" fill="#f9d49a" opacity="0.45"/>
    <circle cx="300" cy="140" r="0.9" fill="#fbd3a0" opacity="0.6"/>
    <circle cx="328" cy="208" r="0.8" fill="#f9d49a" opacity="0.5"/>
    <circle cx="358" cy="96"  r="0.9" fill="#fbd3a0" opacity="0.55"/>
    <circle cx="386" cy="168" r="0.8" fill="#f9d49a" opacity="0.4"/>
    <circle cx="108" cy="232" r="0.8" fill="#f9d49a" opacity="0.45"/>
    <circle cx="148" cy="268" r="0.9" fill="#f9d49a" opacity="0.5"/>
    <circle cx="178" cy="316" r="0.8" fill="#fbd3a0" opacity="0.45"/>
    <circle cx="226" cy="258" r="0.9" fill="#f9d49a" opacity="0.55"/>
    <circle cx="272" cy="226" r="0.8" fill="#f9d49a" opacity="0.45"/>
    <circle cx="312" cy="268" r="0.9" fill="#fbd3a0" opacity="0.5"/>
    <circle cx="354" cy="244" r="0.8" fill="#f9d49a" opacity="0.45"/>
  </g>

  <!-- Vignette -->
  <rect width="480" height="360" fill="url(#vignette)"/>

  <!-- Zoom / attribution corner tags -->
  <g transform="translate(20, 16)" font-family="system-ui, -apple-system, sans-serif" font-size="9" fill="rgba(255,255,255,0.72)" font-weight="500">
    <rect x="-4" y="-10" width="58" height="16" rx="8" fill="rgba(12,20,28,0.78)" stroke="rgba(255,255,255,0.1)"/>
    <text x="25" y="2" text-anchor="middle">New York</text>
  </g>
  <g transform="translate(430, 340)" font-family="system-ui, -apple-system, sans-serif" font-size="7" fill="rgba(255,255,255,0.45)" letter-spacing="0.4">
    <text text-anchor="end">© Esri</text>
  </g>

  <!-- Restaurant pins.  One is "selected" (dark fill, big), others are white pills.
       Positions carry the eye from West Village → Midtown → Williamsburg. -->

  <!-- Joe's (West Village, $6) -->
  <g transform="translate(122, 228)">
    <g filter="none">
      <rect x="-22" y="-11" width="44" height="22" rx="11" fill="#ffffff" stroke="#1a1a1c" stroke-width="1.5"/>
      <text x="-10" y="3.5" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="rgba(26,26,28,0.55)" text-anchor="middle">$</text>
      <text x="5" y="3.5" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#1a1a1c" text-anchor="middle">$6</text>
    </g>
  </g>

  <!-- Via Carota (West Village, $85) -->
  <g transform="translate(158, 258)">
    <rect x="-26" y="-11" width="52" height="22" rx="11" fill="#ffffff" stroke="#1a1a1c" stroke-width="1.5"/>
    <text x="-14" y="3.5" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="rgba(26,26,28,0.55)" text-anchor="middle">$$</text>
    <text x="7" y="3.5" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#1a1a1c" text-anchor="middle">$85</text>
  </g>

  <!-- Atomix (Midtown, $385) — SELECTED: dark, bigger -->
  <g transform="translate(268, 162)">
    <rect x="-34" y="-13" width="68" height="26" rx="13" fill="#1a1a1c" stroke="#ffffff" stroke-width="1.5"/>
    <text x="-20" y="4" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="rgba(255,255,255,0.65)" text-anchor="middle">$$$$</text>
    <text x="13" y="4" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">$385</text>
  </g>

  <!-- Le Bernardin (Midtown, $325) -->
  <g transform="translate(312, 102)">
    <rect x="-28" y="-11" width="56" height="22" rx="11" fill="#ffffff" stroke="#1a1a1c" stroke-width="1.5"/>
    <text x="-15" y="3.5" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="rgba(26,26,28,0.55)" text-anchor="middle">$$$$</text>
    <text x="9" y="3.5" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#1a1a1c" text-anchor="middle">$325</text>
  </g>

  <!-- Semma (Village, $120) -->
  <g transform="translate(208, 218)">
    <rect x="-24" y="-11" width="48" height="22" rx="11" fill="#ffffff" stroke="#1a1a1c" stroke-width="1.5"/>
    <text x="-12" y="3.5" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="rgba(26,26,28,0.55)" text-anchor="middle">$$$</text>
    <text x="6" y="3.5" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#1a1a1c" text-anchor="middle">$120</text>
  </g>

  <!-- Superiority Burger (East Village, $22) -->
  <g transform="translate(238, 254)">
    <rect x="-22" y="-11" width="44" height="22" rx="11" fill="#ffffff" stroke="#1a1a1c" stroke-width="1.5"/>
    <text x="-10" y="3.5" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="rgba(26,26,28,0.55)" text-anchor="middle">$</text>
    <text x="5" y="3.5" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#1a1a1c" text-anchor="middle">$22</text>
  </g>

  <!-- Lilia (Williamsburg, $95) -->
  <g transform="translate(386, 260)">
    <rect x="-26" y="-11" width="52" height="22" rx="11" fill="#ffffff" stroke="#1a1a1c" stroke-width="1.5"/>
    <text x="-14" y="3.5" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="rgba(26,26,28,0.55)" text-anchor="middle">$$$</text>
    <text x="7" y="3.5" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#1a1a1c" text-anchor="middle">$95</text>
  </g>

  <!-- Sailor (Fort Greene, $95) -->
  <g transform="translate(358, 316)">
    <rect x="-26" y="-11" width="52" height="22" rx="11" fill="#ffffff" stroke="#1a1a1c" stroke-width="1.5"/>
    <text x="-14" y="3.5" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="rgba(26,26,28,0.55)" text-anchor="middle">$$$</text>
    <text x="7" y="3.5" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#1a1a1c" text-anchor="middle">$95</text>
  </g>
</svg>
