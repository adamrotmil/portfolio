<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-label="Foothills MUD — terminal">
  <rect width="480" height="360" fill="#0b0b0d"/>

  <!-- Inner terminal bezel for depth -->
  <rect x="0" y="0" width="480" height="360" fill="url(#grad)"/>
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151517"/>
      <stop offset="0.25" stop-color="#0b0b0d"/>
      <stop offset="1" stop-color="#050506"/>
    </linearGradient>
  </defs>

  <!-- ASCII banner — amber/gold, monospace -->
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="14" fill="#d8b4fe">
    <text x="28" y="52"  xml:space="preserve">  _____          _   _     _ _ _</text>
    <text x="28" y="70"  xml:space="preserve"> |  ___|__   ___| |_| |__ (_) | |___</text>
    <text x="28" y="88"  xml:space="preserve"> | |_ / _ \ / _ \ __| '_ \| | | / __|</text>
    <text x="28" y="106" xml:space="preserve"> |  _| (_) | (_) | |_| | | | | \__ \</text>
    <text x="28" y="124" xml:space="preserve"> |_|  \___/ \___/ \__|_| |_|_|_|___/</text>
  </g>

  <!-- Subtitle + welcome -->
  <text x="28" y="150" font-family="ui-monospace, monospace" font-size="11" fill="#c084fc" font-style="italic">
    A classic in the spirit of MUD1, Essex, 1978.
  </text>
  <text x="28" y="170" font-family="ui-monospace, monospace" font-size="11" fill="#c084fc" font-style="italic">
    Welcome, Wanderer. Type 'help' for commands.
  </text>

  <!-- Room name -->
  <text x="28" y="200" font-family="ui-monospace, monospace" font-size="12" fill="#f3d77a" font-weight="700">A Narrow Road</text>

  <!-- Room description -->
  <g font-family="ui-monospace, monospace" font-size="11" fill="#d4d4d4">
    <text x="28" y="218">You are on a narrow road between The Land</text>
    <text x="28" y="234">and the foothills of the Great Mountains.</text>
    <text x="28" y="250">A thatched cottage sits opposite an ancient</text>
    <text x="28" y="266">cemetery in the distance, westward.</text>
  </g>

  <!-- Exits line -->
  <text x="28" y="290" font-family="ui-monospace, monospace" font-size="11" fill="#7dd3fc">Exits: e, n, s, w</text>

  <!-- Prompt line with blinking cursor -->
  <g font-family="ui-monospace, monospace" font-size="11">
    <text x="28" y="318" fill="#67e8f9">[hp 20/20 | lvl 1 | A Narrow Road]&gt;</text>
    <text x="250" y="318" fill="#d4d4d4" xml:space="preserve"> look</text>
  </g>

  <!-- Cursor block -->
  <rect x="278" y="308" width="8" height="13" fill="#d4d4d4" opacity="0.85"/>
</svg>
