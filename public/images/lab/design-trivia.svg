<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-label="Know Your Design Trivia">
  <defs>
    <!--
      Ink + moss — deep teal into almost-black-green, with a subtle
      upper glow.  Reads "studious" / "archive" / "design history."
    -->
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#115E59"/>
      <stop offset="0.55" stop-color="#0F3E3A"/>
      <stop offset="1"   stop-color="#051817"/>
    </linearGradient>
    <radialGradient id="inkGlow" cx="30%" cy="20%" r="70%">
      <stop offset="0" stop-color="#A7F3D0" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#A7F3D0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="480" height="360" fill="url(#ink)"/>
  <rect width="480" height="360" fill="url(#inkGlow)"/>

  <!--
    Glyph: bold sans-serif "?" — the trivia mark, knocked out in white.
    The serif terminals of a proper character read more handsome than
    an outline icon, and the mark is unambiguously about questions.
  -->
  <g transform="translate(240 200)">
    <text x="0" y="0" text-anchor="middle"
          font-family="-apple-system, 'SF Pro Display', system-ui, sans-serif"
          font-size="220" font-weight="700" fill="#FFFFFF"
          letter-spacing="-6"
          dominant-baseline="central">
      ?
    </text>
  </g>

  <!-- Corner label -->
  <text x="444" y="338" text-anchor="end"
        font-family="-apple-system, system-ui, sans-serif"
        font-size="11" font-weight="600" fill="#FFFFFF" fill-opacity="0.62" letter-spacing="0.4">
    Trivia
  </text>
</svg>
